services:
  php:
    build:
      context: ./docker/php
    container_name: camagru_php
    env_file:
      - .env
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - camagru_net

  nginx:
    image: nginx:1.27-alpine
    container_name: camagru_nginx
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - camagru_net

  db:
    image: mariadb:11
    container_name: camagru_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - camagru_net

volumes:
  db_data:

networks:
  camagru_net:
    driver: bridge
